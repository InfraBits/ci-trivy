name: Trivy scanner
description: Scan a container image or SBOM using `trivy`

inputs:
  image:
    description: Container image to scan (mutually exclusive with `sbom`)
    required: false
    type: string
  sbom:
    description: Path to an SBOM file, or a directory of SBOM files, to scan (mutually exclusive with `image`)
    required: false
    type: string
  upload_report:
    required: false
    type: string
    default: "true"
  upload_sarif:
    required: false
    type: string
    default: "true"
  comment_on_pr:
    required: false
    type: string
    default: "true"
  github-token:
    required: false
    type: string
    default: ${{ github.token }}

runs:
  using: "composite"
  steps:
    - id: setup
      shell: bash
      env:
        INPUT_IMAGE: ${{ inputs.image }}
        INPUT_SBOM: ${{ inputs.sbom }}
      run: |
        if [ -n "${INPUT_IMAGE}" ] && [ -n "${INPUT_SBOM}" ];
        then
          echo "::error::Only one of 'image' or 'sbom' may be specified"
          exit 1
        fi
        if [ -z "${INPUT_IMAGE}" ] && [ -z "${INPUT_SBOM}" ];
        then
          echo "::error::One of 'image' or 'sbom' must be specified"
          exit 1
        fi

        work_dir="${{ runner.temp }}/trivy-$(uuidgen)"
        mkdir -p "${work_dir}/cache/" "${work_dir}/reports/" "${work_dir}/docker/" "${work_dir}/sbom/"
        echo "cache_dir=${work_dir}/cache/" >> $GITHUB_OUTPUT
        echo "report_dir=${work_dir}/reports/" >> $GITHUB_OUTPUT

        # Pass through any registry credentials (e.g. from docker/login-action),
        # images published directly to a registry are not available via the docker socket
        docker_config="${DOCKER_CONFIG:-$HOME/.docker}/config.json"
        if [ -f "${docker_config}" ];
        then
          cp "${docker_config}" "${work_dir}/docker/config.json"
        else
          echo '{}' > "${work_dir}/docker/config.json"
        fi
        echo "docker_config_dir=${work_dir}/docker/" >> $GITHUB_OUTPUT

        # Copy the SBOM(s) into a known location so they can be mounted into the trivy container
        if [ -n "${INPUT_SBOM}" ] && [ -f "${INPUT_SBOM}" ];
        then
          cp "${INPUT_SBOM}" "${work_dir}/sbom/"
          echo "scan_type=sbom" >> $GITHUB_OUTPUT
          echo "scan_target=/sbom/$(basename "${INPUT_SBOM}")" >> $GITHUB_OUTPUT
        elif [ -n "${INPUT_SBOM}" ] && [ -d "${INPUT_SBOM}" ];
        then
          # `trivy sbom` only takes a single file, `rootfs` discovers SBOMs
          # (*.spdx, *.spdx.json, *.cdx, *.cdx.json) within a directory
          cp -R "${INPUT_SBOM}/." "${work_dir}/sbom/"
          echo "scan_type=rootfs" >> $GITHUB_OUTPUT
          echo "scan_target=/sbom" >> $GITHUB_OUTPUT
        elif [ -n "${INPUT_SBOM}" ];
        then
          echo "::error::SBOM path '${INPUT_SBOM}' is not a file or directory"
          exit 1
        else
          echo "scan_type=image" >> $GITHUB_OUTPUT
          echo "scan_target=${INPUT_IMAGE}" >> $GITHUB_OUTPUT
        fi
        echo "sbom_dir=${work_dir}/sbom/" >> $GITHUB_OUTPUT

    - name: Execute Trivy scan
      shell: bash
      env:
        SCAN_TYPE: ${{ steps.setup.outputs.scan_type }}
        SCAN_TARGET: ${{ steps.setup.outputs.scan_target }}
      run: |
        docker run -i \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ steps.setup.outputs.report_dir }}:/out" \
            -v "${{ steps.setup.outputs.cache_dir }}:/root/.cache/trivy" \
            -v "${{ steps.setup.outputs.docker_config_dir }}:/root/.docker:ro" \
            -v "${{ steps.setup.outputs.sbom_dir }}:/sbom:ro" \
            ghcr.io/aquasecurity/trivy \
            "${SCAN_TYPE}" \
            --scanners vuln \
            --severity "CRITICAL,HIGH" \
            --exit-code 0 \
            --ignore-unfixed \
            --format template \
            --template @contrib/html.tpl \
            --output /out/trivy.html \
            "${SCAN_TARGET}"

    - name: Generate sarif report
      shell: bash
      env:
        SCAN_TYPE: ${{ steps.setup.outputs.scan_type }}
        SCAN_TARGET: ${{ steps.setup.outputs.scan_target }}
      run: |
        docker run -i \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ steps.setup.outputs.report_dir }}:/out" \
            -v "${{ steps.setup.outputs.cache_dir }}:/root/.cache/trivy" \
            -v "${{ steps.setup.outputs.docker_config_dir }}:/root/.docker:ro" \
            -v "${{ steps.setup.outputs.sbom_dir }}:/sbom:ro" \
            ghcr.io/aquasecurity/trivy \
            "${SCAN_TYPE}" \
            --scanners vuln \
            --severity "CRITICAL,HIGH" \
            --exit-code 0 \
            --ignore-unfixed \
            --format sarif \
            --output /out/trivy.sarif \
            "${SCAN_TARGET}"

      if: inputs.upload_sarif == 'true'

    - name: Generate json report
      shell: bash
      env:
        SCAN_TYPE: ${{ steps.setup.outputs.scan_type }}
        SCAN_TARGET: ${{ steps.setup.outputs.scan_target }}
      run: |
        docker run -i \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ steps.setup.outputs.report_dir }}:/out" \
            -v "${{ steps.setup.outputs.cache_dir }}:/root/.cache/trivy" \
            -v "${{ steps.setup.outputs.docker_config_dir }}:/root/.docker:ro" \
            -v "${{ steps.setup.outputs.sbom_dir }}:/sbom:ro" \
            ghcr.io/aquasecurity/trivy \
            "${SCAN_TYPE}" \
            --scanners vuln \
            --severity "CRITICAL,HIGH" \
            --exit-code 0 \
            --ignore-unfixed \
            --format json \
            --output /out/trivy.json \
            "${SCAN_TARGET}"

      if: inputs.comment_on_pr == 'true' && github.event_name == 'pull_request'

    - name: Upload Trivy report
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: 'Trivy Scan Results'
        path: "${{ steps.setup.outputs.report_dir }}/trivy.html"

      if: inputs.upload_report == 'true'

    - name: Upload SARIF report
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
      continue-on-error: true
      with:
        sarif_file: "${{ steps.setup.outputs.report_dir }}/trivy.sarif"
        category: trivy

      if: inputs.upload_sarif == 'true'

    - name: Comment on PR
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('${{ steps.setup.outputs.report_dir }}/trivy.json', 'utf8'));

          async function run() {
            const severityIcon = { CRITICAL: '🔴', HIGH: '🟠' };

            let sections = [];
            for (const result of (data.Results || [])) {
              const vulns = result.Vulnerabilities || [];
              if (vulns.length !== 0) {
                const rows = vulns.map(v => {
                  const icon = severityIcon[v.Severity] || v.Severity;
                  const cve = `[${v.VulnerabilityID}](https://avd.aquasec.com/nvd/${v.VulnerabilityID.toLowerCase()})`;
                  const title = (v.Title || '').replace(/\|/g, '\\|');
                  return `| ${icon} ${v.Severity} | ${v.PkgName} | ${v.InstalledVersion} | ${v.FixedVersion || '—'} | ${cve} | ${title} |`;
                });
                sections.push(
                  `### ${result.Target}\n` +
                  `| Severity | Package | Installed | Fixed | CVE | Title |\n` +
                  `|----------|---------|-----------|-------|-----|-------|\n` +
                  rows.join('\n')
                );
              }
            }

            const marker = '<!-- trivy-scan -->';
            const maxBody = 65536;
            const header = '## Trivy Security Scan\n\n';
            const truncationNotice = '\n\n> ⚠️ Output truncated — download the full HTML report from the workflow artifacts.';
            let body = marker + '\n' + header + (sections.length ? sections.join('\n\n') : '_No fixable vulnerabilities found._');

            if (body.length > maxBody) {
              body = body.slice(0, maxBody - truncationNotice.length) + truncationNotice;
            }

            const existing = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            }).then(r => r.data.find(c => c.body.includes(marker)));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
          }

          try {
            await run();
          } catch (err) {
            if (err.status === 403) {
              core.warning(`Skipping PR comment: ${err.message}`);
            } else {
              throw err;
            }
          }

      if: inputs.comment_on_pr == 'true' && github.event_name == 'pull_request'
